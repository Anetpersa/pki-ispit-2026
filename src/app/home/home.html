<div class="home">
  <h1>Igračke</h1>

  @if (loading()) {
    <p>Učitavanje...</p>
  }

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  @if (!loading() && !error()) {
    <div class="toy-grid">
      @for (toy of toys(); track toy.toyId) {
        <mat-card class="toy-card">
          <img mat-card-image [src]="imageBaseUrl + toy.imageUrl" [alt]="toy.name" />
          <mat-card-header>
            <mat-card-title>{{ toy.name }}</mat-card-title>
            <mat-card-subtitle>{{ toy.type.name }} · {{ toy.ageGroup.name }}</mat-card-subtitle>
          </mat-card-header>
          <mat-card-content>
            <p>{{ toy.description }}</p>
            <p class="price">{{ toy.price }} RSD</p>
          </mat-card-content>
        </mat-card>
      }
    </div>
  }
</div>
