<mat-toolbar color="primary">
  <div class="toolbar-inner">
    <a class="brand" routerLink="/" (click)="clearSearch()">
      <img src="toybox-logo.png" alt="ToyBox logo" class="brand-logo" />
      <span>ToyBox</span>
    </a>

    <nav>
      <a mat-button routerLink="/igracke" routerLinkActive="active-link" (click)="clearSearch()">
        <mat-icon>toys</mat-icon>
        Igračke
      </a>
      <a mat-button routerLink="/cart" routerLinkActive="active-link" (click)="clearSearch()">
        <mat-icon
          [matBadge]="cartCount()"
          [matBadgeHidden]="cartCount() === 0"
          matBadgeSize="small"
          matBadgeColor="accent"
        >shopping_cart</mat-icon>
        Korpa
        @if (cartCount() > 0) {
        <span>({{ cartCount() }})</span>
        }
      </a>
    </nav>

    <div class="toolbar-search">
      <mat-icon (click)="onSearch()">search</mat-icon>
      <input
        type="text"
        placeholder="Pretraži igračke..."
        aria-label="Pretraži igračke"
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event)"
        (keyup.enter)="onSearch()"
      />
      @if (searchTerm()) {
      <button
        type="button"
        class="clear-search-btn"
        (click)="clearSearch()"
        aria-label="Obriši pretragu"
      >
        ×
      </button>
      }
    </div>

    @if (currentUser()) {
    <button mat-button class="user-menu-trigger" [matMenuTriggerFor]="userMenu">
      <span class="user-name">{{ currentUser()!.firstName }}</span>
      <mat-icon>account_circle</mat-icon>
      <mat-icon class="dropdown-caret">arrow_drop_down</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <a mat-menu-item routerLink="/profil">
        <mat-icon>person</mat-icon>
        <span>Profil</span>
      </a>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Odjava</span>
      </button>
    </mat-menu>
    } @else {
    <div class="auth-links">
      <mat-icon>person</mat-icon>
      <a routerLink="/login">Prijava</a>
      <span class="auth-separator">/</span>
      <a routerLink="/signup">Registracija</a>
    </div>
    }
  </div>
</mat-toolbar>

<router-outlet />

<footer class="site-footer">
  <div class="footer-inner">
    <span>© 2026 ToyBox</span>
  </div>
</footer>
