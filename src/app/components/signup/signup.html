<div class="auth-page">
  <mat-card class="auth-card">
    <button mat-button type="button" class="back-link" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
      Nazad
    </button>

    <h1>Registracija</h1>

    <form (ngSubmit)="onSubmit()" autocomplete="off">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Ime</mat-label>
        <input matInput [ngModel]="firstName()" (ngModelChange)="firstName.set($event)" name="firstName" autocomplete="off" required />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Prezime</mat-label>
        <input matInput [ngModel]="lastName()" (ngModelChange)="lastName.set($event)" name="lastName" autocomplete="off" required />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" autocomplete="off" required />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Telefon</mat-label>
        <input matInput type="tel" [ngModel]="phone()" (ngModelChange)="phone.set($event)" name="phone" autocomplete="off" required />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Adresa</mat-label>
        <input matInput [ngModel]="address()" (ngModelChange)="address.set($event)" name="address" autocomplete="off" required />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Lozinka</mat-label>
        <input
          matInput
          [type]="showPassword() ? 'text' : 'password'"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          autocomplete="new-password"
          required
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="toggleShowPassword()"
          [attr.aria-label]="showPassword() ? 'Sakrij lozinku' : 'Prikaži lozinku'"
        >
          <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button mat-raised-button color="primary" type="submit" class="full-width" [disabled]="loading()">
        {{ loading() ? 'Registracija...' : 'Registruj se' }}
      </button>
    </form>

    <p class="switch-link">
      Već imate nalog? <a routerLink="/login" [queryParams]="returnUrl ? { returnUrl: returnUrl } : {}">Prijavite se</a>
    </p>
  </mat-card>
</div>
