<div class="auth-page">
  <mat-card class="auth-card">
    <button mat-button type="button" class="back-link" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
      Nazad
    </button>

    <h1>Prijava</h1>

    <form (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" required />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Lozinka</mat-label>
        <input
          matInput
          [type]="showPassword() ? 'text' : 'password'"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          required
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="toggleShowPassword()"
          [attr.aria-label]="showPassword() ? 'Sakrij lozinku' : 'Prikaži lozinku'"
        >
          <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button mat-raised-button color="primary" type="submit" class="full-width" [disabled]="loading()">
        {{ loading() ? 'Prijavljivanje...' : 'Prijavi se' }}
      </button>
    </form>

    <p class="switch-link">
      Nemate nalog? <a routerLink="/signup" [queryParams]="returnUrl ? { returnUrl: returnUrl } : {}">Registrujte se</a>
    </p>
  </mat-card>
</div>
